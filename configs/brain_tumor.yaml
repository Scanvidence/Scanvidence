# Brain Tumor Detection Task Configuration
# Used by: scanvidence.tasks.BrainTumorTask.from_config()

task: brain_tumor

data:
  dataset: BraTS
  root: ${BRATS_DATA_ROOT}
  split_seed: 42
  ratios: [0.7, 0.15, 0.15]

preprocessing:
  transforms:
    - skull_strip:
        method: threshold
    - normalize:
        method: zscore
    - registration:
        method: affine
        template: null  # use default MNI152

model:
  type: TumorClassifier
  backbone: resnet50
  num_classes: 4  # glioma, meningioma, pituitary, no-tumor
  pretrained: true

calibration:
  method: temperature_scaling

xai:
  methods:
    - gradcam:
        target_layer: null  # auto-detect last conv layer
    - shap:
        method: deep
    - lime:
        num_samples: 1000

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auroc
  statistical_tests:
    - delong
    - mcnemar
  bootstrap_samples: 1000
